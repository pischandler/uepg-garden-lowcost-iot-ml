[package]
name = "garden-ml-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "garden-ml-server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "timeout"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"

# ONNX Runtime — model inference
# download-binaries: downloads the ONNX Runtime shared lib automatically during build
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }
ndarray = "0.16"

# OpenCV — image processing and feature extraction
# Requires: sudo apt install -y clang libclang-dev libopencv-dev
opencv = { version = "0.92", default-features = false, features = ["clang-runtime", "imgproc", "imgcodecs"] }
